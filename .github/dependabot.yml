version: 2
updates:
  # .NET Backend
  - package-ecosystem: "nuget"
    directory: "/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      nuget-security:
        applies-to: security-updates
        patterns: 
           - "*"

  # React/Vite Frontend
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: 
           - "*"
